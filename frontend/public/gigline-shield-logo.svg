<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 180" width="320" height="360">
  <!-- Shield Outline -->
  <path d="M80,38 L136,57 L136,120 Q136,153 80,172 Q24,153 24,120 L24,57 Z"
    fill="#FFFFFF" stroke="#1C2B2B" stroke-width="2.2"/>
  <!-- Gold Inner Border -->
  <path d="M80,47 L127,64 L127,120 Q127,147 80,163 Q33,147 33,120 L33,64 Z"
    fill="none" stroke="#B8972C" stroke-width="0.9"/>
  <!-- Inspector Mark - Top Line -->
  <line x1="80" y1="57" x2="80" y2="96"
    stroke="#1C2B2B" stroke-width="3" stroke-linecap="butt"/>
  <!-- Inspector Mark - Lock Body -->
  <rect x="72" y="96" width="16" height="8" rx="1.5" fill="#1C2B2B"/>
  <rect x="76" y="97.5" width="8" height="5" rx="0.5" fill="#B8972C"/>
  <!-- Inspector Mark - Bottom Line -->
  <line x1="80" y1="104" x2="80" y2="148"
    stroke="#1C2B2B" stroke-width="3" stroke-linecap="butt"/>
  <!-- Gold Accent Dashes -->
  <line x1="72" y1="65" x2="88" y2="65"
    stroke="#B8972C" stroke-width="1" stroke-dasharray="2,2" stroke-linecap="round"/>
  <line x1="72" y1="140" x2="88" y2="140"
    stroke="#B8972C" stroke-width="1" stroke-dasharray="2,2" stroke-linecap="round"/>
</svg>
