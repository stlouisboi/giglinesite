<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="480" height="120">
  <!-- GL-LOGO-V1: Primary — shield + GigLine + SAFETY & COMPLIANCE + tagline -->
  <!-- Shield -->
  <g transform="translate(10, 2) scale(0.68)">
    <path d="M80,38 L136,57 L136,120 Q136,153 80,172 Q24,153 24,120 L24,57 Z"
      fill="#FFFFFF" stroke="#1C2B2B" stroke-width="2.2"/>
    <path d="M80,47 L127,64 L127,120 Q127,147 80,163 Q33,147 33,120 L33,64 Z"
      fill="none" stroke="#B8972C" stroke-width="0.9"/>
    <!-- Shirt seam -->
    <line x1="80" y1="57" x2="80" y2="96"
      stroke="#1C2B2B" stroke-width="3" stroke-linecap="butt"/>
    <!-- Belt block -->
    <rect x="72" y="96" width="16" height="8" rx="1.5" fill="#1C2B2B"/>
    <!-- Buckle accent -->
    <rect x="76" y="97.5" width="8" height="5" rx="0.5" fill="#B8972C"/>
    <!-- Trouser seam -->
    <line x1="80" y1="104" x2="80" y2="148"
      stroke="#1C2B2B" stroke-width="3" stroke-linecap="butt"/>
    <!-- Alignment ticks (Inspector Mark) -->
    <line x1="72" y1="65" x2="88" y2="65"
      stroke="#B8972C" stroke-width="1" stroke-dasharray="2,2" stroke-linecap="round"/>
    <line x1="72" y1="140" x2="88" y2="140"
      stroke="#B8972C" stroke-width="1" stroke-dasharray="2,2" stroke-linecap="round"/>
  </g>
  <!-- Wordmark -->
  <text x="128" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="700" letter-spacing="-0.5" fill="#1C2B2B">GigLine</text>
  <!-- Gold rule -->
  <line x1="128" y1="60" x2="310" y2="60" stroke="#B8972C" stroke-width="1.2"/>
  <!-- SAFETY & COMPLIANCE -->
  <text x="128" y="78" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="400" letter-spacing="3.5" fill="#1C2B2B">SAFETY &amp; COMPLIANCE</text>
  <!-- Tagline -->
  <text x="128" y="98" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="400" letter-spacing="1.5" fill="#B8972C" font-style="italic">Find it before OSHA does.</text>
</svg>
