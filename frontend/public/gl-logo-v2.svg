<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="420" height="100">
  <!-- GL-LOGO-V2: Secondary — shield + GigLine + SAFETY & COMPLIANCE. No tagline. For header, footer, documents. -->
  <!-- Shield -->
  <g transform="translate(8, 2) scale(0.58)">
    <path d="M80,38 L136,57 L136,120 Q136,153 80,172 Q24,153 24,120 L24,57 Z"
      fill="#FFFFFF" stroke="#1C2B2B" stroke-width="2.2"/>
    <path d="M80,47 L127,64 L127,120 Q127,147 80,163 Q33,147 33,120 L33,64 Z"
      fill="none" stroke="#B8972C" stroke-width="0.9"/>
    <!-- Shirt seam -->
    <line x1="80" y1="57" x2="80" y2="96"
      stroke="#1C2B2B" stroke-width="3" stroke-linecap="butt"/>
    <!-- Belt block -->
    <rect x="72" y="96" width="16" height="8" rx="1.5" fill="#1C2B2B"/>
    <!-- Buckle accent -->
    <rect x="76" y="97.5" width="8" height="5" rx="0.5" fill="#B8972C"/>
    <!-- Trouser seam -->
    <line x1="80" y1="104" x2="80" y2="148"
      stroke="#1C2B2B" stroke-width="3" stroke-linecap="butt"/>
    <!-- Alignment ticks (Inspector Mark) -->
    <line x1="72" y1="65" x2="88" y2="65"
      stroke="#B8972C" stroke-width="1" stroke-dasharray="2,2" stroke-linecap="round"/>
    <line x1="72" y1="140" x2="88" y2="140"
      stroke="#B8972C" stroke-width="1" stroke-dasharray="2,2" stroke-linecap="round"/>
  </g>
  <!-- Wordmark -->
  <text x="108" y="46" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="700" letter-spacing="-0.5" fill="#1C2B2B">GigLine</text>
  <!-- Gold rule -->
  <line x1="108" y1="53" x2="272" y2="53" stroke="#B8972C" stroke-width="1.2"/>
  <!-- SAFETY & COMPLIANCE -->
  <text x="108" y="69" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" letter-spacing="3" fill="#1C2B2B">SAFETY &amp; COMPLIANCE</text>
</svg>
