<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- GigLine Safety & Compliance - Stacked Logo -->
  
  <!-- Shield Icon (centered) -->
  <g transform="translate(50, 10)">
    <!-- Shield outline -->
    <path d="M50 0 L95 10 L95 55 C95 80 50 100 50 100 C50 100 5 80 5 55 L5 10 Z" 
          fill="none" 
          stroke="#22252A" 
          stroke-width="4"/>
    <!-- Gig Line (vertical bar) -->
    <rect x="46" y="15" width="8" height="70" fill="#2E6B5E" rx="1"/>
  </g>
  
  <!-- Wordmark (centered below) -->
  <text x="100" y="140" 
        text-anchor="middle"
        font-family="Inter, Montserrat, 'Source Sans Pro', system-ui, sans-serif" 
        font-size="28" 
        font-weight="700" 
        fill="#22252A">GigLine</text>
  
  <text x="100" y="165" 
        text-anchor="middle"
        font-family="Inter, Montserrat, 'Source Sans Pro', system-ui, sans-serif" 
        font-size="11" 
        font-weight="600" 
        letter-spacing="2"
        fill="#22252A">SAFETY &amp; COMPLIANCE</text>
</svg>
